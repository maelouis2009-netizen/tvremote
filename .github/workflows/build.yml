name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Check if main.py exists
        run: |
          if [ ! -f "main.py" ]; then
            echo "❌ ERREUR CRITIQUE : Le fichier 'main.py' est introuvable dans le dépôt !"
            echo "Assure-toi d'avoir renommé ton fichier Python en 'main.py' et de l'avoir poussé (push) sur GitHub."
            exit 1
          fi
          echo "✅ main.py trouvé, on continue."

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            python3-pip \
            python3-dev \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libgstreamer1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            autoconf \
            libtool \
            pkg-config \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33 virtualenv

      - name: Build APK with Buildozer
        run: |
          export BUILDOZER_ALLOW_ROOT=1
          
          # Création du fichier buildozer.spec
          cat > buildozer.spec << 'EOF'
          [app]
          title = TV Remote
          package.name = tvremote
          package.domain = org.louis
          source.dir = .
          source.include_exts = py,png,jpg,jpeg,webp
          source.include_patterns = assets/*
          version = 1.0
          requirements = python3==3.11.8,kivy==2.3.0,adb_shell,rsa,Pillow,pyjnius
          orientation = portrait
          fullscreen = 0
          android.permissions = INTERNET,ACCESS_NETWORK_STATE
          android.api = 33
          android.minapi = 21
          android.archs = arm64-v8a
          android.accept_sdk_license = True
          
          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF
          
          # Nettoyage avant build pour éviter les conflits de cache corrompu
          buildozer android clean
          
          # Lancement du build
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tvremote-apk
          path: bin/*.apk
